name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME 已配置），
      # 缺少的 platform/build-tools 由 AGP 自动下载，无需额外 setup 步骤

      - name: Download sherpa-onnx AAR (v2.0.1)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-2.0.1.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          ls -la app/libs/

      - name: Download models (VAD / Whisper tiny / 音频打标)
        run: |
          set -e
          mkdir -p app/src/main/assets/models/sensevoice \
                   app/src/main/assets/models/audio_tagging \
                   app/src/main/assets/models/voiceprint
          TMP="$(mktemp -d)"

          # VAD 模型（0.6MB）
          curl -fL --retry 3 -o "$TMP/silero_vad.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          cp "$TMP/silero_vad.onnx" app/src/main/assets/models/

          # SenseVoice 中文识别模型（int8 量化，自带标点与数字归一化）
          curl -fL --retry 3 -o "$TMP/sv.tar.bz2" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09.tar.bz2
          mkdir "$TMP/sv" && tar -xjf "$TMP/sv.tar.bz2" -C "$TMP/sv"
          cp "$(find "$TMP/sv" -name 'model.int8.onnx' | head -1)" \
            app/src/main/assets/models/sensevoice/
          cp "$(find "$TMP/sv" -name 'tokens.txt' | head -1)" \
            app/src/main/assets/models/sensevoice/

          # 环境音分类模型（zipformer small, int8）
          curl -fL --retry 3 -o "$TMP/tagging.tar.bz2" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/audio-tagging-models/sherpa-onnx-zipformer-small-audio-tagging-2024-04-15.tar.bz2
          mkdir "$TMP/tagging" && tar -xjf "$TMP/tagging.tar.bz2" -C "$TMP/tagging"
          cp "$(find "$TMP/tagging" -name 'model.int8.onnx' | head -1)" \
            app/src/main/assets/models/audio_tagging/
          cp "$(find "$TMP/tagging" -name 'class_labels_indices.csv' | head -1)" \
            app/src/main/assets/models/audio_tagging/

          # 声纹模型（3D-Speaker CAM++ 中文，28.3MB，单文件直下）
          curl -fL --retry 3 -o "$TMP/vp.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx
          cp "$TMP/vp.onnx" app/src/main/assets/models/voiceprint/

          du -sh app/src/main/assets/models/*

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionCode=${{ github.run_number }} 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      # 构建失败时上传完整日志，便于远程排错
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      # 构建失败时把日志推到 logs 分支（公开分支可免登录读取，用于自动排错）
      - name: Push build log to logs branch (on failure)
        if: failure()
        run: |
          git config user.name "build-log-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B logs
          git add build-log.txt
          git commit -m "ci: build log from run #${{ github.run_number }}" || true
          git push -f origin logs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HearingAssist-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 每次推送自动发布一个 Release，方便手机/浏览器直接下载
      - name: Publish to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 自动构建 #${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            每次推送 main 自动构建的 APK。
            下载 app-release.apk 安装即可（无需签名验证，已用 debug 签名）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
