name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME 已配置），
      # 缺少的 platform/build-tools 由 AGP 自动下载，无需额外 setup 步骤

      - name: Download sherpa-onnx AAR (v2.0.1)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-2.0.1.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          ls -la app/libs/

      # 模型不再打包进 APK：由 App 首次使用时按需下载并本地缓存（ModelManager，国内镜像优先）。
      # 这样代码更新只需下载小 APK，模型不变不重下。

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionCode=${{ github.run_number }} 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      # 构建失败时上传完整日志，便于远程排错
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      # 构建失败时把日志推到 logs 分支（公开分支可免登录读取，用于自动排错）
      - name: Push build log to logs branch (on failure)
        if: failure()
        run: |
          git config user.name "build-log-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B logs
          git add build-log.txt
          git commit -m "ci: build log from run #${{ github.run_number }}" || true
          git push -f origin logs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HearingAssist-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 每次推送自动发布一个 Release，方便手机/浏览器直接下载
      - name: Publish to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 自动构建 #${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            每次推送 main 自动构建的 APK。
            下载 app-release.apk 安装即可（无需签名验证，已用 debug 签名）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 把最新版本号写入 main 分支 version.json，供 App 经 raw.githubusercontent.com 检测更新
      # （raw 源在国内通常比 api.github.com 更可达，作为更新检测的主源）
      - name: Publish version.json to main
        if: github.event_name == 'push'
        run: |
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          echo "{\"version\": ${{ github.run_number }}}" > version.json
          git add version.json
          git commit -m "chore: bump version.json to ${{ github.run_number }} [skip ci]" || true
          git push origin main
