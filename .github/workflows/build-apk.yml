name: Build APK

on:
  push:
    branches: [ main, master, fix/background-stop, fix/scroll-version, fix/update-download ]
  workflow_dispatch:

permissions:
  contents: write

# 正式发布串行，不取消正在发布的任务；版本只能在完整发布后推进。
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_HOST: github.com
      GH_REPO: ${{ github.repository }}
      GH_PROMPT_DISABLED: '1'
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version rules
        id: version
        run: |
          python -I -m unittest discover -s scripts/tests -v
          python -I scripts/release_version.py inspect --output "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ]; then
            git fetch origin main
            python -I scripts/release_version.py validate-current
            python -I scripts/release_version.py check-tags
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download sherpa-onnx AAR (v2.0.1)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-2.0.1.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar

      - name: Bundle small models (vad + streaming)
        run: |
          set -e
          mkdir -p app/src/main/assets/bundled
          curl -fL --retry 3 -o app/src/main/assets/bundled/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          curl -fL --retry 3 -o app/src/main/assets/bundled/streaming.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-small-ctc-zh-int8-2025-04-01.tar.bz2

      - name: Test and lint
        env:
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest lintRelease --no-daemon --stacktrace \
            "-PappVersionCode=$VERSION_CODE" "-PappVersionName=$VERSION_NAME" 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Build APK after verification
        env:
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            "-PappVersionCode=$VERSION_CODE" "-PappVersionName=$VERSION_NAME" 2>&1 | tee -a build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Push build log to logs branch on failure
        if: failure()
        run: |
          if [ -f build-log.txt ]; then
            git config user.name "build-log-bot"
            git config user.email "bot@users.noreply.github.com"
            git checkout -B logs
            git add build-log.txt
            git commit -m "ci: verification log" || true
            git push -f origin logs
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.versionName }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Recheck publication version and tag absence
        if: env.PUBLISH == 'true'
        run: |
          git fetch origin main
          python -I scripts/release_version.py validate-current
          python -I scripts/release_version.py check-tags

      - name: Publish named release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.versionName }}
          name: ${{ steps.version.outputs.versionName }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: 'true'
          body: |
            测试与 lint 通过后的 APK，使用现有签名；尚未替代荣耀 X50 真机验收。
            对应源码：https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            许可：https://github.com/${{ github.repository }}/blob/${{ github.sha }}/LICENSE
            第三方许可：https://github.com/${{ github.repository }}/blob/${{ github.sha }}/THIRD_PARTY_NOTICES.md

      # 仅第一次迁移保留旧更新器写死的下载地址，与主发布挂载同一 APK。
      - name: Publish one-time legacy compatibility release
        if: env.PUBLISH == 'true' && steps.version.outputs.legacyBridge == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.versionCode }}
          name: ${{ steps.version.outputs.versionName }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: 'false'
          body: |
            仅供旧更新器的兼容下载入口。此 APK 与同版本命名发布完全相同。
            对应源码：https://github.com/${{ github.repository }}/tree/${{ github.sha }}

      - name: Verify published APKs and update manifests
        if: env.PUBLISH == 'true'
        run: |
          python -I scripts/release_version.py verify-assets --apk app/build/outputs/apk/release/app-release.apk
          git fetch origin main
          python -I scripts/release_version.py validate-current
          git checkout -B main origin/main
          python -I scripts/release_version.py advance
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add release.properties updates/latest.json version.json
          git commit -m "chore: advance published version [skip ci]"
          git push origin main
